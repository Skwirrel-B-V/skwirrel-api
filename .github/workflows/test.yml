name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Generated files match the fixture
        run: |
          node scripts/generate.mjs --input test/fixtures/rpc-discover-v3.json
          git status --porcelain
          test -z "$(git status --porcelain)"
