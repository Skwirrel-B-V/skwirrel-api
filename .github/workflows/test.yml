name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: Generated files match the fixture
        run: |
          node scripts/generate.mjs --input test/fixtures/rpc-discover-v3.json
          git status --porcelain
          test -z "$(git status --porcelain)"
